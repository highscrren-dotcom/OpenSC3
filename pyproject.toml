[build-system]
requires = ["setuptools>=77"]  # license — SPDX-строка (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "opensc3"
version = "0.0.1"
description = "OpenSC3 — open control panel for the fifine AmpliGame SC3 on Linux"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []           # ядро — только stdlib + системная libusb-1.0 (ctypes)

[project.optional-dependencies]
buttons = ["evdev"]          # sc3 listen; в CachyOS — python-evdev
hotplug = ["pyudev"]         # будущая служба; python-pyudev
obs = ["websockets"]         # будущая связь с OBS; python-websockets
panel = ["PySide6>=6.8"]     # окно и трей (opensc3); в CachyOS — pyside6

[project.scripts]
sc3 = "opensc3.cli:main"

[project.gui-scripts]
opensc3 = "opensc3.app.main:main"

[tool.setuptools]
packages = ["opensc3", "opensc3.app"]

[tool.setuptools.package-data]
# QML окна, шрифт Arimo с лицензией (SIL OFL 1.1), значки трея — едут с пакетом
"opensc3.app" = ["qml/*.qml", "qml/qmldir", "fonts/*.ttf", "fonts/*.txt", "icons/*.svg", "icons/png/*.png"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["research"]  # разовые скрипты разведки, не пакет
